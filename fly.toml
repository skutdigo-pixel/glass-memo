app = "glass-memo"   # change to a globally unique name
primary_region = "nrt"

[build]

[env]
  PORT = "3000"
  NODE_ENV = "production"
  DATA_DIR = "/data"
  # BASE_URL is set via `fly secrets set BASE_URL=https://<app>.fly.dev`

[[mounts]]
  source = "memo_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
