name = "glass-memo"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/auth/*", "/media/*", "/healthz"]

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "glass-memo"
database_id = "REPLACE_WITH_D1_ID"

[[kv_namespaces]]
binding = "MEDIA"
id = "REPLACE_WITH_KV_ID"
